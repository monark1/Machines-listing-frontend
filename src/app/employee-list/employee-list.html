<div class="page-container">
  <h3 class="page-title">Employees</h3>

  <input #searchBox
    type="text"
    class="search-input"
    placeholder="Search by name or email..."
    [value]="searchTerm()"
    (input)="onSearchChange(searchBox.value)"
  />

  @if (isLoading()) {
    <p class="loading-text">Loading employees...</p>
  } @else {
    <table class="data-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Department</th>
          <th>Date Joined</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        @for (emp of employees(); track emp.id) {
          <tr>
            <td>{{ emp.fullName }}</td>
            <td>{{ emp.email }}</td>
            <td>{{ emp.department }}</td>
            <td>{{ emp.dateJoined | date }}</td>
            <td>
              <span [class]="emp.status === 'active' ? 'badge-active' : 'badge-inactive'">
                {{ emp.status }}
              </span>
            </td>
            <td class="employee-actions">
              <button
                [class]="emp.status === 'active' ? 'btn-danger btn-sm' : 'btn-success btn-sm'"
                (click)="toggleStatus(emp)"
              >
                {{ emp.status === 'active' ? 'Deactivate' : 'Reactivate' }}
              </button>
            </td>
          </tr>
        }
        @empty {
          <tr><td colspan="6" class="empty-state">No registered employees yet.</td></tr>
        }
      </tbody>
    </table>
  }
</div>
