<div class="container mt-4">
  <h3 class="mb-3">Employees</h3>

  <input
    type="text"
    class="form-control mb-3"
    placeholder="Search by name or email..."
    [value]="searchTerm()"
    (input)="onSearchChange($any($event.target).value)"
  />

  @if (isLoading()) {
    <p class="text-muted">Loading employees...</p>
  } @else {
    <table class="table table-striped table-hover">
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Department</th>
          <th>Date Joined</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        @for (emp of employees(); track emp.id) {
          <tr>
            <td>{{ emp.fullName }}</td>
            <td>{{ emp.email }}</td>
            <td>{{ emp.department }}</td>
            <td>{{ emp.dateJoined | date }}</td>
            <td>
              <span class="badge" [class.bg-success]="emp.status === 'active'" [class.bg-secondary]="emp.status === 'inactive'">
                {{ emp.status }}
              </span>
            </td>
            <td>
              <button
                class="btn btn-sm"
                [class.btn-outline-danger]="emp.status === 'active'"
                [class.btn-outline-success]="emp.status === 'inactive'"
                (click)="toggleStatus(emp)"
              >
                {{ emp.status === 'active' ? 'Deactivate' : 'Reactivate' }}
              </button>
            </td>
          </tr>
        }
        @empty {
          <tr><td colspan="6" class="text-center text-muted">No registered employees yet.</td></tr>
        }
      </tbody>
    </table>
  }
</div>
