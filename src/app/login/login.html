<div class="auth-page">
  <div class="card">
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
    <h2 class="login-title">Login</h2>

    <div class="form-field">
      <label for="username">Username <span class="required-asterisk">*</span></label>
      <input id="username" type="text" formControlName="username" />
      @if (loginForm.get('username')?.touched && loginForm.get('username')?.invalid) {
        <p class="field-error">Username is required.</p>
      }
    </div>

    <div class="form-field">
      <label for="password">Password <span class="required-asterisk">*</span></label>
      <input id="password" type="password" formControlName="password" />
      @if (loginForm.get('password')?.touched && loginForm.get('password')?.invalid) {
        <p class="field-error">Password is required.</p>
      }
    </div>

    <button type="submit" class="btn-submit" [disabled]="isSubmitting()">
      {{ isSubmitting() ? 'Logging in...' : 'Login' }}
    </button>

    <p class="login-footer">
      Don't have an account? <button type="button" class="btn-outline" (click)="goToRegister()">Register Here</button>
    </p>
  </form>
</div>
</div>
