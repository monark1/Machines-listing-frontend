<div class="d-flex justify-content-center align-items-center" style="min-height: 80vh;">
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="form-card" style="max-width: 360px; width: 100%;">
    <h2 class="mb-3">Login</h2>

    <div class="field mb-3">
      <label>Username</label>
      <input type="text" class="form-control" formControlName="username" />
      @if (loginForm.get('username')?.touched && loginForm.get('username')?.invalid) {
        <p class="field-error">Username is required.</p>
      }
    </div>

    <div class="field mb-3">
      <label>Password</label>
      <input type="password" class="form-control" formControlName="password" />
      @if (loginForm.get('password')?.touched && loginForm.get('password')?.invalid) {
        <p class="field-error">Password is required.</p>
      }
    </div>

    <button type="submit" class="btn btn-primary w-100" [disabled]="isSubmitting()">
      {{ isSubmitting() ? 'Logging in...' : 'Login' }}
    </button>

    <p class="text-center mt-3">
      Don't have an account? <a routerLink="/register">Register here</a>
    </p>
  </form>
</div>
